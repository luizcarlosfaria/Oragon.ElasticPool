name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: build-${{ matrix.os }}-${{ matrix.tfm }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        tfm: [ net8.0, net9.0, net10.0 ]
    steps:
      - uses: actions/checkout@v4

      - name: setup .NET (8.0.x, 9.0.x, 10.0.x)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: dotnet restore
        run: dotnet restore Oragon.ElasticPool.slnx

      - name: dotnet restore (LiveDashboard sample)
        run: dotnet restore samples/Oragon.ElasticPool.RabbitMQ.Sample.LiveDashboard/Oragon.ElasticPool.RabbitMQ.Sample.LiveDashboard.slnx

      - name: dotnet build (Release, ${{ matrix.tfm }})
        run: dotnet build Oragon.ElasticPool.slnx -c Release --no-restore -f ${{ matrix.tfm }}
        # Directory.Build.props sets TreatWarningsAsErrors=true. CI sets CI=true,
        # which activates ContinuousIntegrationBuild and DeterministicSourcePaths.

      - name: dotnet build LiveDashboard sample (Release, ${{ matrix.tfm }})
        run: >
          dotnet build samples/Oragon.ElasticPool.RabbitMQ.Sample.LiveDashboard/Oragon.ElasticPool.RabbitMQ.Sample.LiveDashboard.slnx
          -c Release --no-restore -f ${{ matrix.tfm }}

      # 100% OSS test stack: xUnit v3 + Microsoft.Testing.Platform.
      # global.json sets test.runner=Microsoft.Testing.Platform → dotnet test runs in MTP mode.
      # `--solution` discovers all test projects; Stress is excluded via IsTestProject=false.
      # IntegrationTests use Testcontainers (Docker is preinstalled on ubuntu-latest runners).
      - name: dotnet test (solution-wide; Stress excluded by IsTestProject=false)
        run: >
          dotnet test --solution Oragon.ElasticPool.slnx
          --configuration Release --no-build -f ${{ matrix.tfm }}
          -- --report-trx --results-directory $GITHUB_WORKSPACE/TestResults/${{ matrix.tfm }}
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      # Coverage gate per CONTEXT.md: 90% line coverage on Oragon.ElasticPool.Core only.
      # coverlet.msbuild integrates as MSBuild target — works under MTP without VSTest collectors.
      - name: coverage on Core (cobertura via coverlet.msbuild)
        run: >
          dotnet test --project tests/Oragon.ElasticPool.Core.Tests/Oragon.ElasticPool.Core.Tests.csproj
          --configuration Release --no-build -f ${{ matrix.tfm }}
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=$GITHUB_WORKSPACE/TestResults/${{ matrix.tfm }}/coverage.cobertura.xml
          /p:Include='[Oragon.ElasticPool.Core]*'
          /p:Threshold=90
          /p:ThresholdType=line
          /p:ThresholdStat=total

      - name: install reportgenerator (HTML artifact only — gate already enforced above)
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: generate HTML coverage report (artifact upload)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          REPORT="$GITHUB_WORKSPACE/TestResults/${{ matrix.tfm }}/coverage.cobertura.xml"
          if [ ! -f "$REPORT" ]; then
            echo "::warning::Coverage cobertura.xml not found at $REPORT — skipping HTML report"
            exit 0
          fi
          reportgenerator \
            -reports:"$REPORT" \
            -targetdir:"$GITHUB_WORKSPACE/TestResults/${{ matrix.tfm }}/coverage-report" \
            -reporttypes:'Html;TextSummary' \
            -assemblyfilters:"+Oragon.ElasticPool.Core"
          cat "$GITHUB_WORKSPACE/TestResults/${{ matrix.tfm }}/coverage-report/Summary.txt"

      - name: upload coverage report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.tfm }}
          path: ./TestResults/${{ matrix.tfm }}/coverage-report
          if-no-files-found: ignore

      - name: upload TRX test reports (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trx-${{ matrix.tfm }}
          path: ./TestResults/${{ matrix.tfm }}/**/*.trx
          if-no-files-found: ignore
